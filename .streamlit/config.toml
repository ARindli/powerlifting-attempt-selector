[theme]
base = "dark"
primaryColor = "#5B8DEF"
backgroundColor = "#131518"
secondaryBackgroundColor = "#1C1F24"
textColor = "#EDEEF0"
borderColor = "#2C3036"
baseRadius = "8px"
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
headingFont = "Barlow Condensed:https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&display=swap"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&display=swap"

[client]
toolbarMode = "minimal"